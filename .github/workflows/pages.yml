name: Website · GitHub Pages

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    if: github.event_name == 'pull_request' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '26.9.0'
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Set Pages base path
        env:
          CONFIGURED_BASE: ${{ vars.SITE_BASE }}
          REPOSITORY: ${{ github.repository }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          repo_name="${REPOSITORY#*/}"
          if [[ -n "$CONFIGURED_BASE" ]]; then
            site_base="$CONFIGURED_BASE"
          elif [[ "${repo_name,,}" == "${REPOSITORY_OWNER,,}.github.io" ]]; then
            site_base="/"
          else
            site_base="/$repo_name/"
          fi
          printf 'SITE_BASE=%s\n' "$site_base" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm run test:static
      - name: Upload rendered site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: website/.output/public

  deploy:
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: build
    runs-on: ubuntu-26.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6.0.0
      - name: Deploy verified site
        id: deployment
        uses: actions/deploy-pages@v5.0.1
